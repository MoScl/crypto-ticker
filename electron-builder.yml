appId: com.cryptoticker.app
productName: CryptoTicker
copyright: Copyright © 2026

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json
  # 托盘图标（真实字体渲染，主进程运行时加载）：
  # Windows 金色徽章 32px + @2x；macOS 彩色圆角矩形 16pt/22pt（各 @1x/@2x/@3x）
  - assets/tray-icon.png
  - assets/tray-icon@2x.png
  - assets/tray-mac16.png
  - assets/tray-mac16@2x.png
  - assets/tray-mac16@3x.png
  - assets/tray-mac22.png
  - assets/tray-mac22@2x.png
  - assets/tray-mac22@3x.png

extraResources:
  # 随包安装到 <安装目录>\resources\app.ico。
  # 用途：安装脚本用这个独立 ico 文件为桌面/开始菜单快捷方式显式指定图标，
  # 不依赖 app exe 的图标注入结果（双保险，见 build/installer.nsh）。
  - from: assets/icon.ico
    to: app.ico

# P9：Windows 安装包（NSIS）
win:
  target: nsis
  # 应用图标（托盘图标由运行时生成，此处的 icon.ico 用于 exe/安装包）
  # 必须是含多尺寸的 ico：16/24/32/48/64/128/256 @32bpp（当前 assets/icon.ico 已满足）。
  # electron-builder 会通过 rcedit 把它注入 CryptoTicker.exe，
  # 而 NSIS 生成的快捷方式图标指向的就是 exe（CreateShortCut ... "$appExe" 0），
  # 所以 exe 图标 = 快捷方式图标。
  icon: assets/icon.ico
  # 注意：不要再设 signAndEditExecutable: false ——那会让 rcedit 整段跳过，
  # exe 保留 Electron 默认图标，安装后桌面/开始菜单快捷方式就会显示系统默认图标。
  # （Windows 上 rcedit 走 app-builder 自带实现，不需要下载 winCodeSign。
  #   若确实因环境报错，恢复该选项后快捷方式图标仍由 build/installer.nsh 兜底。）

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # 显式声明快捷方式行为（默认即为 true，写出来避免被其他配置覆盖）
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CryptoTicker
  # 安装程序自身 / 卸载程序的图标（不设时不会继承 win.icon，必须显式指定）
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  # 安装完成后的自定义 NSIS 脚本：重建快捷方式图标 + 刷新系统图标缓存
  include: build/installer.nsh

# ===== macOS 应用包（dmg + zip）=====
# 注意：mac 目标只能在 macOS 上构建。在 macOS 机器上执行：
#   npx electron-builder --mac
# icon 用 1024x1024 PNG，electron-builder 会经 iconutil 自动转 icns。
mac:
  # dmg 目标会同时产出 release/mac-universal/CryptoTicker.app 和 release/*.dmg
  target:
    - target: dmg
      arch:
        - universal   # arm64 + x86_64 合一的单个通用二进制
    - zip             # zip 备用分发格式（同 universal）
  icon: assets/icon.png
  category: public.app-category.finance
  # 最低支持 macOS 11 (Big Sur)——必须是字符串，数字会导致 LaunchServices 启动崩溃
  minimumSystemVersion: "11.0"
  # 签名相关（拿到证书后生效，未签名时无影响）：
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 无 Apple 开发者证书时跳过签名（dmg 首次打开需右键 → 打开；有证书后删除此行
  # 或设置环境变量 CSC_LINK / CSC_KEY_PASSWORD 即可自动签名+公证）
  identity: null

# ===== Linux 应用包（AppImage + deb）=====
# Linux 构建需在 Linux 机器上执行：npx electron-builder --linux
# AppImage 用 icon.png（512px 以上均可，electron-builder 自动缩放）；
# deb 的 hicolor 图标用 icon-512.png。
linux:
  target:
    - AppImage
    - deb
  icon: assets/icon.png
  category: Utility

# ===== Apple 公证（Notarization）=====
# 拿到 Apple Developer 账号后，设置以下环境变量再重新打包即可自动公证：
#   APPLE_ID                    你的 Apple ID 邮箱
#   APPLE_APP_SPECIFIC_PASSWORD App 专用密码（appleid.apple.com 生成）
#   APPLE_TEAM_ID               开发者团队 ID（10 位）
# 并将上方 mac.identity: null 删除（或改回 Developer ID Application 证书名）。
# notarize: true   # <- 配齐凭据后取消注释

# ===== 代码签名（对外分发才需要）=====
# 未签名时，Win10/11 首次运行会弹出 SmartScreen“未知发布者”，用户点“仍要运行”即可。
# 若要消除警告，购买 EV 代码签名证书后，在下方填入对应字段（或设环境变量），再 `npm run dist`：
# win:
#   sign:
#     certificateSubjectName: "你的公司/姓名"
#     certificatePassword: %CSC_KEY_PASSWORD%
# 也可使用环境变量 CSC_LINK / CSC_KEY_PASSWORD 指定 .pfx 证书。

# 注：托盘图标由主进程在运行时生成（见 src/main/tray.ts），无需额外资源文件。
# 开发运行（npm run dev）不需要应用图标。
